name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Testes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (TypeScript estrito)
        run: pnpm typecheck
      - name: Testes TypeScript (Vitest)
        run: pnpm test
      - name: Relay de hooks (sidecar)
        run: node scripts/prepare-sidecar.mjs --debug
      - name: Testes Rust
        run: cargo test --workspace --locked
      - name: Build do frontend
        run: pnpm --filter @ids/desktop build
      - name: Testes de interface (Playwright)
        if: runner.os == 'Linux'
        run: |
          pnpm --filter @ids/desktop exec playwright install --with-deps chromium
          pnpm test:e2e

  bundle:
    name: Pacotes (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            bundles: deb,appimage
          - name: windows
            os: windows-latest
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Relay de hooks (release)
        run: node scripts/prepare-sidecar.mjs
      - name: Build Tauri
        working-directory: apps/desktop
        run: pnpm tauri build --bundles ${{ matrix.bundles }}
      - name: Verificar pacotes gerados
        shell: bash
        run: |
          ls -la target/release/bundle/*/
          case "${{ matrix.name }}" in
            linux) ls target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage ;;
            windows) ls target/release/bundle/msi/*.msi target/release/bundle/nsis/*.exe ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ilha-das-sombras-${{ matrix.name }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
